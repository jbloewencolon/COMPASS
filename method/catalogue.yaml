  "language_rules": [
    {
      "id": "LR1",
      "version": "0.1.0-draft",
      "label": "Support mandatory wording with actual authority",
      "instruction": "Say that law requires or prohibits an action only when the identified authority is binding, in force, verified and applicable to the claimed entity/activity/date. Name the source and locator. A valid local binding instrument may also require conduct within its actual authority and scope; published research or a voluntary standard does not become law because it is strong evidence.",
      "required_basis": [
        "binding_authority",
        "in_force",
        "verified",
        "applicable_scope"
      ],
      "valid_local_instruments_may_bind": true
    },
    {
      "id": "LR2",
      "version": "0.1.0-draft",
      "label": "A bill is not a current duty",
      "instruction": "A bill reference never establishes a current duty by itself. Label introduced, pending or dead bills and adopted-not-effective instruments with their actual status. Explain a proposal as would require, not requires; only separately verified enacted and effective authority may support an existing legal duty.",
      "bill_creates_duty": false
    }
  ]
