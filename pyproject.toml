[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-policy-review"
version = "0.1.0"
description = "Evidence-linked, jurisdiction-aware policy review foundation"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.1"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["compass*"]

[tool.setuptools.package-data]
compass = ["static/*"]
